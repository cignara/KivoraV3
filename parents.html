<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Parent Dashboard · Kivora Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--sky:#4A90E2;--coral:#FF6B6B;--yellow:#FFD93D;--green:#52C41A;--purple:#9B59B6;--charcoal:#2C3E50;--gray:#7F8C8D}
  body{font-family:'Nunito',sans-serif;background:#F0F4F8;min-height:100vh;color:var(--charcoal)}
  a{text-decoration:none;color:inherit}
  /* Nav */
  .pd-nav{height:64px;background:white;display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;border-bottom:2px solid var(--yellow)}
  .pd-nav-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
  .pd-logo{font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;color:var(--charcoal);display:flex;align-items:center;gap:8px}
  .pd-logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--sky));display:flex;align-items:center;justify-content:center;font-size:16px}
  .pd-logo span{color:var(--sky)}
  .pd-nav-right{display:flex;gap:10px;align-items:center}
  .pd-user-email{font-size:.78rem;color:var(--gray);font-weight:600}
  .pd-btn{font-family:'Fredoka',sans-serif;font-size:.82rem;font-weight:600;padding:8px 16px;border-radius:8px;border:1.5px solid #DDE5ED;cursor:pointer;background:white;color:var(--charcoal);transition:all .2s}
  .pd-btn:hover{border-color:var(--sky);color:var(--sky)}
  .pd-btn.primary{background:var(--sky);color:white;border-color:var(--sky)}
  .pd-btn.danger{border-color:#fca5a5;color:#dc2626}
  /* Layout */
  .pd-wrap{max-width:1200px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:260px 1fr;gap:24px}
  /* Sidebar */
  .pd-sidebar{display:flex;flex-direction:column;gap:12px}
  .pd-children{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .pd-children-title{font-family:'Baloo 2',cursive;font-size:.9rem;font-weight:700;color:var(--gray);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
  .child-tab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:4px}
  .child-tab.active{background:var(--sky);color:white}
  .child-tab:not(.active):hover{background:#EAF4FE;color:var(--sky)}
  .child-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--yellow));display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
  .child-name{font-family:'Fredoka',sans-serif;font-size:.9rem;font-weight:600}
  .child-age{font-size:.7rem;opacity:.7}
  .add-child-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:2px dashed #DDE5ED;color:var(--gray);cursor:pointer;font-family:'Fredoka',sans-serif;font-size:.85rem;font-weight:500;transition:all .2s;margin-top:6px}
  .add-child-btn:hover{border-color:var(--sky);color:var(--sky)}
  .pd-quick{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .pd-quick-title{font-family:'Baloo 2',cursive;font-size:.9rem;font-weight:700;color:var(--gray);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
  .quick-link{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:all .2s;font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--charcoal)}
  .quick-link:hover{background:#F0F4F8;color:var(--sky)}
  /* Main */
  .pd-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .pd-stat{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .pd-stat-icon{font-size:1.5rem;margin-bottom:6px}
  .pd-stat-val{font-family:'Baloo 2',cursive;font-size:1.5rem;font-weight:800;margin-bottom:2px}
  .pd-stat-label{font-size:.75rem;color:var(--gray)}
  .pd-stat-trend{font-size:.72rem;color:var(--green);margin-top:4px}
  .pd-card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:18px}
  .pd-card-title{font-family:'Baloo 2',cursive;font-size:1rem;font-weight:800;color:var(--charcoal);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  /* Subject bars */
  .subject-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .subj-icon{font-size:1.2rem;width:32px;text-align:center}
  .subj-name{font-family:'Fredoka',sans-serif;font-size:.85rem;font-weight:600;width:100px;flex-shrink:0}
  .subj-bar-wrap{flex:1;height:8px;background:#E8EFF6;border-radius:4px;overflow:hidden}
  .subj-bar{height:100%;border-radius:4px;transition:width 1s ease}
  .subj-pct{font-family:'Fredoka',sans-serif;font-size:.78rem;font-weight:600;width:36px;text-align:right;flex-shrink:0}
  /* Activity list */
  .activity-list{display:flex;flex-direction:column;gap:10px}
  .activity-item{display:flex;align-items:center;gap:12px;padding:12px;background:#F8FAFB;border-radius:10px}
  .act-icon{font-size:1.4rem;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#EAF4FE}
  .act-name{font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600;color:var(--charcoal)}
  .act-sub{font-size:.72rem;color:var(--gray);margin-top:2px}
  .act-time{font-size:.72rem;color:var(--gray);margin-left:auto;white-space:nowrap;padding-left:8px}
  .act-xp{font-family:'Fredoka',sans-serif;font-size:.75rem;font-weight:700;color:var(--sky);background:#EAF4FE;padding:3px 8px;border-radius:20px;white-space:nowrap;margin-left:6px}
  /* Screen time */
  .time-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .time-ctrl{background:#F8FAFB;border-radius:12px;padding:14px}
  .tc-label{font-family:'Fredoka',sans-serif;font-size:.82rem;font-weight:600;color:var(--gray);margin-bottom:8px}
  .tc-input{display:flex;align-items:center;gap:10px}
  .tc-input input{width:70px;padding:6px 10px;border-radius:8px;border:1.5px solid #DDE5ED;font-family:'Nunito',sans-serif;font-size:.9rem;text-align:center}
  .tc-save{margin-top:10px;font-family:'Fredoka',sans-serif;font-size:.78rem;font-weight:600;padding:7px 16px;border:none;border-radius:20px;background:var(--sky);color:white;cursor:pointer}
  /* Empty / loading states */
  .empty-state{text-align:center;padding:40px;color:var(--gray);font-size:.9rem}
  .loading{opacity:.5;font-size:.85rem;text-align:center;padding:24px}
  @media(max-width:900px){
    .pd-wrap{grid-template-columns:1fr}
    .pd-sidebar{display:grid;grid-template-columns:1fr 1fr}
    .pd-summary{grid-template-columns:repeat(2,1fr)}
    .time-controls{grid-template-columns:1fr}
  }
  @media(max-width:520px){
    .pd-summary{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<nav class="pd-nav">
  <div class="pd-nav-inner">
    <a class="pd-logo" href="index.html">
      <div class="pd-logo-icon">🐨</div>
      Kivora<span>Learning</span>
    </a>
    <div class="pd-nav-right">
      <span class="pd-user-email" id="pdUserEmail"></span>
      <a href="index.html"><button class="pd-btn primary">+ Activities</button></a>
      <button class="pd-btn danger" onclick="kivoraSignOut()">Sign Out</button>
    </div>
  </div>
</nav>

<div class="pd-wrap">
  <!-- Sidebar -->
  <div class="pd-sidebar">
    <div class="pd-children">
      <div class="pd-children-title">My Children</div>
      <div id="childrenList"><div class="loading">Loading…</div></div>
      <a href="index.html" class="add-child-btn" style="display:flex;align-items:center;gap:8px;color:var(--gray);text-decoration:none">+ Add Child</a>
    </div>
    <div class="pd-quick">
      <div class="pd-quick-title">Quick Links</div>
      <a href="index.html" class="quick-link">📚 Learning Activities</a>
      <a href="printables.html" class="quick-link">🖨️ Printable Worksheets</a>
      <a href="index.html" class="quick-link">🏆 View Rewards</a>
      <a href="pricing.html" class="quick-link">💳 Manage Subscription</a>
    </div>
  </div>

  <!-- Main content -->
  <div class="pd-main" id="pdMain">
    <div class="loading">Loading dashboard…</div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function() {
  'use strict';

  var CONFIG = {
    apiKey: "AIzaSyBXdDDJvdInfdhovdx_Jo3YN_dhY-RY8yo",
    authDomain: "kivora-learning.firebaseapp.com",
    databaseURL: "https://kivora-learning-default-rtdb.firebaseio.com",
    projectId: "kivora-learning",
    storageBucket: "kivora-learning.firebasestorage.app",
    messagingSenderId: "145485791442",
    appId: "1:145485791442:web:d0a6f467aecc29101f6d0b"
  };

  if (!firebase.apps.length) firebase.initializeApp(CONFIG);
  var auth = firebase.auth();
  var db   = firebase.database();

  var activeChildId = null;
  var allChildren   = [];

  // World → subject mapping
  var WORLD_SUBJECT = {
    'alphabet-island':  { label: 'Language',   icon: '📚', color: 'linear-gradient(90deg,#FF69B4,#9B59B6)' },
    'number-kingdom':   { label: 'Math',        icon: '🔢', color: 'linear-gradient(90deg,#4A90E2,#9B59B6)' },
    'science-lab':      { label: 'Science',     icon: '🔬', color: 'linear-gradient(90deg,#00C49A,#52C41A)' },
    'creative-studio':  { label: 'Creative',    icon: '🎨', color: 'linear-gradient(90deg,#FF8C42,#FFD93D)' },
    'logic-land':       { label: 'Logic',       icon: '🧩', color: 'linear-gradient(90deg,#9B59B6,#4A90E2)' },
    'life-skills':      { label: 'Life Skills', icon: '❤️', color: 'linear-gradient(90deg,#FF6B6B,#FF8C42)' }
  };
  var SUBJECT_ORDER = ['Language','Math','Science','Creative','Logic','Life Skills'];

  function dbRef(uid, path) { return db.ref('users/' + uid + '/' + path); }

  function relTime(ts) {
    var d = Date.now() - ts;
    if (d < 60000) return 'Just now';
    if (d < 3600000) return Math.floor(d/60000) + 'm ago';
    if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
    if (d < 172800000) return 'Yesterday';
    return new Date(ts).toLocaleDateString();
  }

  function gradeLabel(grade) {
    var m = { 'pre-k':'Pre-K','kindergarten':'Kindergarten','grade-1':'Grade 1','grade-2':'Grade 2','grade-3':'Grade 3','grade-4':'Grade 4','grade-5':'Grade 5' };
    return m[grade] || grade || '';
  }

  function computeStreak(progressObj) {
    if (!progressObj) return 0;
    var days = {};
    Object.values(progressObj).forEach(function(p) {
      if (p.ts) {
        var d = new Date(p.ts);
        var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        days[key] = true;
      }
    });
    var streak = 0;
    var cur = new Date();
    while (true) {
      var key = cur.getFullYear() + '-' + cur.getMonth() + '-' + cur.getDate();
      if (days[key]) { streak++; cur.setDate(cur.getDate() - 1); }
      else break;
    }
    return streak;
  }

  function getLocalChildren() {
    try { return JSON.parse(localStorage.getItem('kivora_children') || '[]'); } catch(e) { return []; }
  }

  function getLocalProgress(childId) {
    try { return JSON.parse(localStorage.getItem('kivora_progress_' + childId) || '{}'); } catch(e) { return {}; }
  }

  function syncLocalChildrenToFirebase(uid, localKids) {
    localKids.forEach(function(c) {
      db.ref('users/' + uid + '/children/' + c.id).set(c).catch(function() {});
      var prog = getLocalProgress(c.id);
      Object.keys(prog).forEach(function(code) {
        var p = prog[code];
        db.ref('users/' + uid + '/progress/' + c.id + '/' + code).set({
          childId: c.id, code: code, ts: p.ts || Date.now(),
          stars: p.stars || 1, xp: p.xp || 0, coins: p.coins || 0,
          name: p.name || code, world: p.world || '', icon: p.icon || '📚'
        }).catch(function() {});
      });
    });
  }

  function displayChildren(uid) {
    var list = document.getElementById('childrenList');
    if (!allChildren.length) {
      list.innerHTML = '<div class="empty-state" style="padding:12px">No children yet.<br><a href="index.html" style="color:var(--sky)">Go to Activities</a> to add one!</div>';
      renderMainEmpty();
      return;
    }
    list.innerHTML = allChildren.map(function(c, i) {
      return '<div class="child-tab' + (i === 0 ? ' active' : '') + '" onclick="selectChild(\'' + c.id + '\',this)">' +
        '<div class="child-avatar">' + (c.avatar || '🐨') + '</div>' +
        '<div style="flex:1"><div class="child-name">' + escHtml(c.name) + '</div>' +
        '<div class="child-age">' + gradeLabel(c.grade) + '</div></div>' +
        '<a href="index.html?childId=' + encodeURIComponent(c.id) + '" title="Start learning as ' + escHtml(c.name) + '" ' +
          'style="font-size:.8rem;background:var(--green);color:#fff;border-radius:6px;padding:3px 8px;white-space:nowrap;text-decoration:none;flex-shrink:0" ' +
          'onclick="event.stopPropagation()">▶</a>' +
        '</div>';
    }).join('');
    activeChildId = allChildren[0].id;
    renderChildDashboard(uid, allChildren[0]);
  }

  function renderChildren(uid) {
    // Step 1: load localStorage immediately — never leave UI on "Loading…"
    var localKids = getLocalChildren();
    allChildren = localKids.slice();
    displayChildren(uid); // renders empty state if no local kids
    if (localKids.length) {
      syncLocalChildrenToFirebase(uid, localKids);
    }

    // Step 2: merge Firebase children; give it 6 seconds before giving up
    var childDone = false;
    var childTimer = setTimeout(function() {
      childDone = true;
      console.warn('[ParentDash] Firebase children query timed out');
    }, 6000);

    dbRef(uid, 'children').once('value').then(function(snap) {
      clearTimeout(childTimer);
      if (childDone) return;
      childDone = true;
      var cloudKids = [];
      snap.forEach(function(d) { cloudKids.push(d.val()); });
      var added = false;
      cloudKids.forEach(function(c) {
        if (!allChildren.find(function(x) { return x.id === c.id; })) {
          allChildren.push(c);
          added = true;
        }
      });
      if (added) displayChildren(uid);
    }).catch(function(err) {
      clearTimeout(childTimer);
      console.warn('[ParentDash] Firebase children load failed:', err.message);
    });
  }

  window.selectChild = function(childId, el) {
    activeChildId = childId;
    document.querySelectorAll('.child-tab').forEach(function(t) { t.classList.remove('active'); });
    el.classList.add('active');
    var child = allChildren.find(function(c) { return c.id === childId; });
    if (child) renderChildDashboard(auth.currentUser.uid, child);
  };

  function buildDashboardFromProgress(uid, child, progressObj) {
    var main = document.getElementById('pdMain');
    var entries = Object.values(progressObj);

      // Stats
      var totalXP   = entries.reduce(function(s, p) { return s + (p.xp || 0); }, 0);
      var totalActs = entries.length;
      var totalStars = entries.reduce(function(s, p) { return s + (p.stars || 1); }, 0);
      var streak    = computeStreak(progressObj);

      // Subject breakdown
      var subjectMap = {};
      entries.forEach(function(p) {
        var subj = (WORLD_SUBJECT[p.world] || { label: 'General', icon: '🌟', color: 'linear-gradient(90deg,#94a3b8,#64748b)' });
        if (!subjectMap[subj.label]) subjectMap[subj.label] = { count: 0, xp: 0, icon: subj.icon, color: subj.color };
        subjectMap[subj.label].count++;
        subjectMap[subj.label].xp += (p.xp || 0);
      });
      var maxSubjCount = Math.max(1, Math.max.apply(null, Object.values(subjectMap).map(function(s) { return s.count; })));

      var subjHTML = SUBJECT_ORDER.filter(function(s) { return subjectMap[s]; }).map(function(label) {
        var s = subjectMap[label];
        var pct = Math.round((s.count / maxSubjCount) * 100);
        return '<div class="subject-row">' +
          '<span class="subj-icon">' + s.icon + '</span>' +
          '<span class="subj-name">' + label + '</span>' +
          '<div class="subj-bar-wrap"><div class="subj-bar" style="width:0%;background:' + s.color + '" data-pct="' + pct + '"></div></div>' +
          '<span class="subj-pct">' + s.count + ' act</span>' +
          '</div>';
      }).join('') || '<div class="empty-state">No activities yet — start learning!</div>';

      // Recent activity (last 8, sorted by ts desc)
      var recent = entries.slice().sort(function(a, b) { return (b.ts || 0) - (a.ts || 0); }).slice(0, 8);
      var recentHTML = recent.map(function(p) {
        var subj = WORLD_SUBJECT[p.world] || { label: 'General', icon: '🌟' };
        return '<div class="activity-item">' +
          '<div class="act-icon">' + (p.icon || subj.icon) + '</div>' +
          '<div><div class="act-name">' + escHtml(p.name || p.code) + '</div>' +
          '<div class="act-sub">' + subj.label + ' · ' + (p.stars || 1) + '⭐</div></div>' +
          '<span class="act-time">' + (p.ts ? relTime(p.ts) : '') + '</span>' +
          '<span class="act-xp">+' + (p.xp || 0) + ' XP</span>' +
          '</div>';
      }).join('') || '<div class="empty-state">No activities yet — go explore!</div>';

      main.innerHTML =
        '<div class="pd-summary">' +
          statCard('⏱️', totalXP + ' XP', 'Total XP earned', var_color('sky'), '') +
          statCard('📚', totalActs, 'Activities done', var_color('purple'), '') +
          statCard('⭐', totalStars, 'Stars earned', var_color('yellow'), '') +
          statCard('🔥', streak + ' day' + (streak === 1 ? '' : 's'), 'Current streak', var_color('coral'), '') +
        '</div>' +

        '<div class="pd-card">' +
          '<div class="pd-card-title">📊 Progress by Subject <span style="font-size:.75rem;font-weight:500;color:var(--gray)">' + totalActs + ' activities total</span></div>' +
          subjHTML +
        '</div>' +

        '<div class="pd-card">' +
          '<div class="pd-card-title">⚡ Recent Activity</div>' +
          '<div class="activity-list">' + recentHTML + '</div>' +
        '</div>' +

        '<div class="pd-card" id="screenTimeCard">' +
          '<div class="pd-card-title">⏰ Screen Time Controls</div>' +
          '<div class="loading">Loading settings…</div>' +
        '</div>';

      // Animate progress bars
      setTimeout(function() {
        document.querySelectorAll('.subj-bar[data-pct]').forEach(function(bar) {
          bar.style.width = bar.getAttribute('data-pct') + '%';
        });
      }, 50);

      // Load screen time settings
      loadScreenTime(uid, child.id);
  }

  function renderChildDashboard(uid, child) {
    var main = document.getElementById('pdMain');
    main.innerHTML = '<div class="loading">Loading ' + escHtml(child.name) + '\'s data…</div>';

    // Load from localStorage immediately
    var localProg = getLocalProgress(child.id);

    // Try Firebase; fall back to localStorage on error or after timeout
    var done = false;
    function useFallback() {
      if (done) return;
      done = true;
      buildDashboardFromProgress(uid, child, localProg);
    }

    var timer = setTimeout(useFallback, 5000); // 5s timeout

    dbRef(uid, 'progress/' + child.id).once('value').then(function(snap) {
      clearTimeout(timer);
      if (done) return;
      done = true;
      var progressObj = snap.val() || {};
      // Merge cloud + local (cloud wins for same key)
      var merged = Object.assign({}, localProg, progressObj);
      buildDashboardFromProgress(uid, child, merged);
    }).catch(function() {
      clearTimeout(timer);
      useFallback();
    });
  }

  function loadScreenTime(uid, childId) {
    dbRef(uid, 'settings/' + childId).once('value').then(function(snap) {
      renderScreenTimeCard(childId, snap.val() || {});
    }).catch(function() { renderScreenTimeCard(childId, {}); });
  }

  function renderScreenTimeCard(childId, s) {
    var card = document.getElementById('screenTimeCard');
    if (!card) return;
    card.innerHTML =
      '<div class="pd-card-title">⏰ Screen Time Controls</div>' +
      '<div class="time-controls">' +
        '<div class="time-ctrl">' +
          '<div class="tc-label">Daily Time Limit</div>' +
          '<div class="tc-input"><input type="number" id="stLimit" value="' + (s.dailyLimit || 60) + '" min="15" max="240"/><span>min / day</span></div>' +
          '<button class="tc-save" onclick="saveScreenTime(\'' + childId + '\')">Save</button>' +
        '</div>' +
        '<div class="time-ctrl">' +
          '<div class="tc-label">Bedtime Lock (no screen after)</div>' +
          '<div class="tc-input"><input type="time" id="stBedtime" value="' + (s.bedtime || '20:00') + '"/></div>' +
          '<button class="tc-save" onclick="saveScreenTime(\'' + childId + '\')">Save</button>' +
        '</div>' +
      '</div>';
  }

  window.saveScreenTime = function(childId) {
    var uid = auth.currentUser && auth.currentUser.uid;
    if (!uid) return;
    var limit   = parseInt(document.getElementById('stLimit').value, 10) || 60;
    var bedtime = document.getElementById('stBedtime').value || '20:00';
    dbRef(uid, 'settings/' + childId).set({ dailyLimit: limit, bedtime: bedtime })
      .then(function() { showToast('✅ Screen time saved'); })
      .catch(function(e) { showToast('Error: ' + e.message); });
  };

  function renderMainEmpty() {
    document.getElementById('pdMain').innerHTML =
      '<div class="pd-card"><div class="empty-state">' +
      '<div style="font-size:3rem;margin-bottom:12px">🦊</div>' +
      '<div style="font-family:\'Baloo 2\',cursive;font-size:1.1rem;font-weight:800;margin-bottom:8px">No children yet!</div>' +
      '<p>Go to <a href="index.html" style="color:var(--sky)">Activities</a> and enter a child\'s name to get started.</p>' +
      '</div></div>';
  }

  function statCard(icon, val, label, color, trend) {
    return '<div class="pd-stat">' +
      '<div class="pd-stat-icon">' + icon + '</div>' +
      '<div class="pd-stat-val" style="color:' + color + '">' + val + '</div>' +
      '<div class="pd-stat-label">' + label + '</div>' +
      (trend ? '<div class="pd-stat-trend">' + trend + '</div>' : '') +
    '</div>';
  }

  function var_color(name) { return 'var(--' + name + ')'; }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:.85rem;font-weight:700;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.2)';
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 2800);
  }

  window.kivoraSignOut = function() {
    auth.signOut().then(function() { window.location.href = './index.html'; });
  };

  // Auth guard
  auth.onAuthStateChanged(function(user) {
    if (!user) {
      window.location.href = './index.html';
      return;
    }
    var emailEl = document.getElementById('pdUserEmail');
    if (emailEl) emailEl.textContent = user.displayName || user.email || '';
    renderChildren(user.uid);
  });

})();
</script>
</body>
</html>
